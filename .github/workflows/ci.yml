name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install as a uv tool
        run: uv tool install .
      - name: Smoke-test the installed CLI
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          subthis --version
          subthis --help
          if echo "" | subthis setup; then
            echo "setup should have exited non-zero without an API key" >&2
            exit 1
          fi
          echo "setup rejected empty key as expected"
